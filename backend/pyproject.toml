[project]
name = "campusai-backend"
version = "0.1.0"
description = "UIS CampusAI backend — FastAPI gateway, retrieval, generation, verification"
requires-python = ">=3.11"
dependencies = [
    "fastapi (>=0.115,<1.0)",
    "uvicorn[standard] (>=0.32,<1.0)",
    "pydantic (>=2.9,<3.0)",
    "pydantic-settings (>=2.6,<3.0)",
    "fastembed (>=0.8.1,<0.9.0)",
    "qdrant-client (>=1.19.1,<2.0.0)",
]

[tool.poetry]
packages = [{ include = "app" }]

[tool.poetry.group.dev.dependencies]
pytest = ">=8.3,<9.0"
httpx = ">=0.27,<1.0"
ruff = ">=0.7,<1.0"
black = ">=24.10,<25.0"

[build-system]
requires = ["poetry-core>=2.0"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.pytest.ini_options]
testpaths = ["tests"]
