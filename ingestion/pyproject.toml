[project]
name = "campusai-ingestion"
version = "0.1.0"
description = "UIS CampusAI ingestion pipeline — extraction, cleaning, chunking, metadata"
requires-python = ">=3.11,<4.0"
dependencies = [
    "pydantic (>=2.9,<3.0)",
    "beautifulsoup4 (>=4.12,<5.0)",
    "lxml (>=5.3,<6.0)",
    "pypdf (>=5.0,<6.0)",
]

[tool.poetry]
packages = [{ include = "ingestion" }]

[tool.poetry.group.dev.dependencies]
pytest = ">=8.3,<9.0"
ruff = ">=0.7,<1.0"
black = ">=24.10,<25.0"
reportlab = ">=4.2,<5.0"

[build-system]
requires = ["poetry-core>=2.0"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.pytest.ini_options]
testpaths = ["tests"]
