[project]
name = "campusai-evaluation"
version = "0.1.0"
description = "UIS CampusAI retrieval/generation evaluation harness"
requires-python = ">=3.11,<4.0"
dependencies = [
    "campusai-backend @ file:../backend",
]

[tool.poetry]
packages = [{ include = "evaluation" }]

[tool.poetry.group.dev.dependencies]
pytest = ">=8.3,<9.0"
ruff = ">=0.7,<1.0"
black = ">=24.10,<25.0"

[build-system]
requires = ["poetry-core>=2.0"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.pytest.ini_options]
testpaths = ["tests"]
