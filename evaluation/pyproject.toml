[project]
name = "campusai-evaluation"
version = "0.1.0"
description = "UIS CampusAI retrieval/generation evaluation harness"
requires-python = ">=3.11,<4.0"
dependencies = [
    "campusai-backend",
]

[tool.poetry]
packages = [{ include = "evaluation" }]

[tool.poetry.dependencies]
# Poetry's own path-dependency syntax, not a PEP 508 "file:" URL —
# the latter's relative-path form isn't reliably portable across poetry
# versions (worked with the locally installed version, broke against
# whatever `pipx install poetry` resolves in CI: "invalid URL
# 'file:../backend'"). This form is documented as the correct way to
# express a path/git dependency's source even when [project] otherwise
# uses PEP 621 syntax for everything else.
campusai-backend = { path = "../backend", develop = true }

[tool.poetry.group.dev.dependencies]
pytest = ">=8.3,<9.0"
ruff = ">=0.7,<1.0"
black = ">=24.10,<25.0"

[build-system]
requires = ["poetry-core>=2.0"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.pytest.ini_options]
testpaths = ["tests"]
